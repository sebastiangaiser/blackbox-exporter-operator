# This rule is not used by the project blackbox-exporter-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to monitoring.gaiser.bayern resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: blackbox-exporter-operator
    app.kubernetes.io/managed-by: kustomize
  name: blackboxmodule-viewer-role
rules:
- apiGroups:
  - monitoring.gaiser.bayern
  resources:
  - blackboxmodules
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - monitoring.gaiser.bayern
  resources:
  - blackboxmodules/status
  verbs:
  - get
