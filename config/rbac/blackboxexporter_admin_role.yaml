# This rule is not used by the project blackbox-exporter-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over monitoring.gaiser.bayern.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: blackbox-exporter-operator
    app.kubernetes.io/managed-by: kustomize
  name: blackboxexporter-admin-role
rules:
- apiGroups:
  - monitoring.gaiser.bayern
  resources:
  - blackboxexporters
  verbs:
  - '*'
- apiGroups:
  - monitoring.gaiser.bayern
  resources:
  - blackboxexporters/status
  verbs:
  - get
