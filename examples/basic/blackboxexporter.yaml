apiVersion: monitoring.gaiser.bayern/v1alpha1
kind: BlackboxExporter
metadata:
  name: main
  namespace: monitoring
spec:
  replicas: 1
  image:
    repository: quay.io/prometheus/blackbox-exporter
    tag: v0.28.0
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  moduleSelector:
    namespaceSelector:
      any: true
    matchLabels:
      exporter: main
