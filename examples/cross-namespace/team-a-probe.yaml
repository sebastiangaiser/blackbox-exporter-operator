apiVersion: monitoring.gaiser.bayern/v1alpha1
kind: BlackboxProbe
metadata:
  name: our-api
  namespace: team-a
spec:
  exporterRef:
    name: shared
    namespace: monitoring
  moduleRef:
    name: http-2xx
    namespace: monitoring
  targets:
    - https://api.team-a.internal/health
    - https://api.team-a.internal/ready
  interval: 30s
  scrapeTimeout: 10s
  # assigned to every metric scraped from spec.targets
  targetLabels:
    team: team-a
  # applied to the generated Probe object, not to the metrics
  probeMetadata:
    labels:
      team: team-a
